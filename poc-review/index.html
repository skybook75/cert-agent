const Q = { q: "", issuer: "", cert_type: "", expiry_from: "", expiry_to: "", status: "", preset: -1, set: "A" };
function search(p) {
  return (Q.set === "B" ? D.dbB : D.dbA).map((r) => { const d = dayDiff(r.not_after, BASE); return { ...r, days: d, status: statusOf(d) }; }).filter((r) => {

    if (p.issuer && r.issuer_cn !== p.issuer) return false;
    if (p.cert_type && r.cert_type !== p.cert_type) return false;
    if (p.expiry_from && r.not_after.slice(0, 10) < p.expiry_from) return false;
    if (p.expiry_to && r.not_after.slice(0, 10) > p.expiry_to) return false;
    if (p.status && r.status !== p.status) return false;
    return true;
  }).sort((a, b) => a.days - b.days);
}

    <div class="panel"><h3 style="margin-top:0">certificate 테이블 (브라우저 메모리 DB · ${RUN.db.size}행)</h3>
      <div class="filters"><input class="f" id="r-q" placeholder="검색어(CN·도메인·일련번호·파일명)" value="${esc(RUN.q)}" style="flex:1 1 220px" aria-label="검색어">
        <select class="f" id="r-st" aria-label="상태"><option value="">상태 전체</option>${["만료", "D-7", "D-30", "정상"].map((s) => `<option ${s === RUN.st ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      ${tbl(["cert_id", "file_name", "subject_cn", "issuer_cn", "만료일", "남은 일수", "상태", "종류", "공개키", "SHA-256"], rows.map((r) => `<tr><td class="num">${r.cert_id}</td><td class="mono">${esc(r.file_name)}</td><td>${esc(r.subject_cn)}</td><td>${esc(r.issuer_cn)}</td><td class="mono nw">${esc(r.not_after.slice(0, 10))}</td><td class="num">${r.days}</td><td>${pill(r.status)}</td><td class="nw">${esc(r.cert_type)}</td><td class="nw">${esc(r.public_key)}</td><td class="mono" title="${esc(r.sha256_fingerprint)}">${esc(r.sha256_fingerprint.slice(0, 17))}…</td></tr>`).concat(rows.length ? [] : [`<tr><td colspan="10" class="note">DB가 비어 있습니다.</td></tr>`]), 980)}
      <p class="note">남은 일수와 상태는 오늘(${todayKst()}) 기준으로 계산합니다. 이 DB는 이 브라우저 탭에서만 유지되며 새로고침하면 비워집니다.</p>
      ${RUN.history.length ? `<h3>실행 이력</h3>${tbl(["시각", "대상", "파일", "신규", "갱신", "실패", "DB 전체", "처리 시간", "비밀번호"], RUN.history.map((h) => `<tr><td class="nw">${esc(h.at)}</td><td>${esc(h.root)}</td><td class="num">${h.targets}</td><td class="num">${h.n}</td><td class="num">${h.u}</td><td class="num">${h.f}</td><td class="num"><b>${h.total}</b></td><td class="num">${(h.ms / 1000).toFixed(3)}초</td><td>${h.pw ? "입력" : "-"}</td></tr>`), 680)}` : ""}
    </div>`;
  $("pick-dir").onclick = () => $("in-dir").click(); $("pick-files").onclick = () => $("in-files").click(); $("pick-sample").onclick = useSamples;
  $("in-dir").onchange = (e) => e.target.files.length && fromInput(e.target.files); $("in-files").onchange = (e) => e.target.files.length && fromInput(e.target.files);
  const dz = $("drop");
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); }; dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("over"); fromDrop(e.dataTransfer); };
  $("run-go").onclick = runAgent;
  $("run-clear").onclick = () => { RUN.db.clear(); RUN.nextId = 1; RUN.last = null; renderRun(); };
  $("r-q").oninput = (e) => { RUN.q = e.target.value; const pos = e.target.selectionStart; renderRun(); $("r-q").focus(); try { $("r-q").setSelectionRange(pos, pos); } catch {} };
  $("r-st").onchange = (e) => { RUN.st = e.target.value; renderRun(); };
  if (L) renderRunLive();
}

// ───────── 보기 전환
function view(v) {
  ["review", "progress", "run"].forEach((k) => { $("tab-" + k).setAttribute("aria-selected", String(v === k)); $("view-" + k).hidden = v !== k; });
  if (v !== "progress") stop();
  if (v === "progress") renderProgress();
  if (v === "run") renderRun();
  try { history.replaceState(null, "", v === "review" ? "#step-" + STEPS[cur].id : "#" + v); } catch {}
}
$("tab-review").onclick = () => view("review"); $("tab-progress").onclick = () => view("progress"); $("tab-run").onclick = () => view("run");
renderSteps(); renderStage();
if (location.hash === "#progress") view("progress");
if (location.hash === "#run") view("run");
</script>

</body>
</html>
