<style>
/* Layout: 상단 바(사용자·연결 상태) → 역할별 탭 → 탭 본문. 운영 도구라 표·상태 칩 중심. 로그인 전에는 로그인 카드만. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #16202b; --muted: #5a6675; --line: #dce2e9;
  --accent: #1d4f7a; --accent-soft: #e5eef7;
  --ok: #1f7a4d; --ok-soft: #e2f3e9; --warn: #9a6400; --warn-soft: #fbf0d9; --crit: #b3261e; --crit-soft: #fbe5e3;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151c; --surface: #172029; --ink: #e5eaf0; --muted: #98a4b3; --line: #29343f; --accent: #82b2dd; --accent-soft: #1b2b3b;
  --ok: #70ce9b; --ok-soft: #163125; --warn: #e6b45a; --warn-soft: #352a14; --crit: #ef8a80; --crit-soft: #391c1a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #172029; --ink: #e5eaf0; --muted: #98a4b3; --line: #29343f; --accent: #82b2dd; --accent-soft: #1b2b3b;
  --ok: #70ce9b; --ok-soft: #163125; --warn: #e6b45a; --warn-soft: #352a14; --crit: #ef8a80; --crit-soft: #391c1a; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.who select, .who input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.who input { width: 96px; }
.conn { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); display: inline-flex; gap: 6px; align-items: center; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: inline-block; }
.conn.ok i { background: var(--ok); }
.me { font-weight: 600; color: var(--ink); }
nav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
nav button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.badge { font-size: 11px; font-weight: 700; background: var(--crit); color: var(--surface); border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
.badge:empty { display: none; }
section[role="tabpanel"] { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 15px; }
.card h3 { margin: 14px 0 8px; font-size: 13.5px; }
.tiles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
button.tile { font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; }
button.tile:hover { border-color: var(--accent); } button.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.tile.crit b { color: var(--crit); } .tile.warn b { color: var(--warn); } .tile.ok b { color: var(--ok); } .tile.acc b { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; }
button.btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }

button.btn:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.f, select.f, textarea.f { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }

.mono { font-family: var(--font-mono); font-size: 12.5px; }

tr.click { cursor: pointer; } tr.click:hover, tr.sel { background: var(--accent-soft); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.pill.s-정상, .pill.k-일치, .pill.k-갱신본, .pill.k-확인_완료, .pill.d-배포_완료, .pill.d-검토_통과, .pill.r-완료, .pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.s-D-30, .pill.k-불일치, .pill.k-이전_버전, .pill.d-요청, .pill.r-진행_중, .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.s-D-7, .pill.s-만료, .pill.k-미수집, .pill.d-검토_반려, .pill.d-원복, .pill.bad { background: var(--crit-soft); color: var(--crit); }
.pill.muted { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
button.pill { border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; padding: 3px 10px; }
button.pill:hover { filter: brightness(0.96); text-decoration: underline; }
button.pill[aria-expanded="true"] { border-color: currentColor; }
button.pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); padding: 18px 4px; }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
dl.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); margin: 0; }
dl.kv dt, dl.kv dd { margin: 0; padding: 6px 0; border-top: 1px solid var(--line); }
dl.kv dt { color: var(--muted); font-size: 12.5px; }
dl.kv dd { overflow-wrap: anywhere; }
.stages { display: flex; gap: 4px; flex-wrap: wrap; }
.stage { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--muted); white-space: nowrap; }
.stage.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 600; }
.stage.wip { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 600; }
.stage.bad { background: var(--crit-soft); color: var(--crit); border-color: transparent; font-weight: 600; }
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
.msg { border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 92%; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--surface); }
.msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
.msg .meta { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); white-space: normal; }
.msg .meta a { color: var(--accent); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.orch svg { width: 100%; height: auto; display: block; }
.orch .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.orch .node text { fill: var(--ink); font-size: 12px; } .orch .node .sub { fill: var(--muted); font-size: 10.5px; }
.orch .node.ok rect { stroke: var(--ok); fill: var(--ok-soft); } .orch .node.bad rect { stroke: var(--crit); fill: var(--crit-soft); }
.orch .node.human rect { stroke: var(--warn); fill: var(--warn-soft); } .orch .node.run rect { stroke: var(--accent); stroke-width: 3; }
.orch .edge { stroke: var(--line); stroke-width: 1.5; fill: none; } .orch .edge.on { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 4; animation: dash 0.8s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) { .orch .edge.on { animation: none; } }
.trace { list-style: none; margin: 8px 0 0; padding: 0; } .trace li { border-left: 3px solid var(--line); padding: 6px 10px; margin: 0 0 6px; background: var(--bg); border-radius: 0 8px 8px 0; font-size: 13px; }
.trace li.ok { border-left-color: var(--ok); } .trace li.bad { border-left-color: var(--crit); } .trace li.human { border-left-color: var(--warn); }
.finding { border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; }
.finding.f-높음 { border-left-color: var(--crit); } .finding.f-중간 { border-left-color: var(--warn); } .finding.f-낮음 { border-left-color: var(--accent); }
.finding pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); margin: 6px 0; max-height: 120px; overflow: auto; }
.approve-box { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: #f0fdfb; }
pre.diff { white-space: pre; overflow: auto; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 260px; }
.examples button, .chips button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
pre.email { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 13px; margin: 8px 0 0; }
.verify { align-self: flex-start; max-width: 92%; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: 13px; margin-top: -4px; }
.verify.v-적합 { border-left-color: var(--ok); } .verify.v-주의 { border-left-color: var(--warn); } .verify.v-부적합 { border-left-color: var(--crit); } .verify.v-참고 { border-left-color: var(--muted); }
.verify .vh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600; }
.verify .score { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.verify .score i { display: inline-block; width: 56px; height: 6px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.verify .score i b { display: block; height: 100%; background: var(--accent); }
.verify ul { margin: 6px 0 0; padding-left: 18px; } .verify li { margin: 2px 0; }
.msg.superseded { opacity: .55; }
.msg.superseded::before { content: "1차 답변 · 검증에서 부적합 → 아래에 다시 씀"; display: block; font-size: 11.5px; font-weight: 700; color: var(--crit); margin-bottom: 4px; }
details.agentlog { font-size: 12.5px; color: var(--muted); margin: -2px 0 10px; }
details.agentlog summary { cursor: pointer; font-weight: 600; }
details.agentlog ol { margin: 6px 0 0; padding-left: 20px; font-family: var(--font-mono); font-size: 12px; }
.verify .rules { margin-top: 6px; font-size: 12px; color: var(--muted); }
.gdrop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px; background: var(--bg); }
.gdrop.over { border-color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: min(520px, calc(100vw - 32px)); }
.note { font-size: 12.5px; color: var(--muted); }
.auth { max-width: 400px; margin: 40px auto; }
.auth form { display: grid; gap: 10px; }
.auth label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.err { color: var(--crit); font-size: 13px; min-height: 1.2em; }
.check-ok { color: var(--ok); font-weight: 700; } .check-bad { color: var(--crit); font-weight: 700; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } .split, .cols2 { grid-template-columns: 1fr; } }
/* 좁은 화면: 표를 행마다 카드로 (머리글은 각 칸 왼쪽에 표시), 탭은 가로로 밀기 */
@media (max-width: 640px) {
  .tbl table { min-width: 0 !important; }
  .tbl table thead { display: none; }
  .tbl table, .tbl tbody { display: block; }
  .tbl table tr { display: block; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; padding: 6px 12px; background: var(--surface); }
  .tbl table tr.sel { border-color: var(--accent); }
  .tbl table td { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; border: 0; padding: 5px 0; text-align: right; }
  .tbl table td > * { text-align: right; }
  .tbl table td[data-l]::before { content: attr(data-l); color: var(--muted); font-size: 12px; text-align: left; flex: 0 0 34%; }
  .tbl table td:first-child { font-weight: 600; }
  .tbl table td[colspan], .tbl table td:not([data-l]) { display: block; text-align: left; }
  .tbl table td .row { justify-content: flex-end; }
  .tbl table td.mono, .tbl table td .mono, .tbl table td .sub { word-break: break-all; }
  nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  nav button { white-space: nowrap; flex: 0 0 auto; }

}
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } dl.kv { grid-template-columns: 1fr; } }
</style>

<script>
"use strict";
const C = window.CertCore, X = window.XlsxLite;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString().slice(0, 19) + "+00:00";
const COLLS = ["certificates", "discoveries", "renewals", "notifications", "scan_runs", "audit", "deployments", "environments", "import_runs", "guides"];
const S = { mode: null, user: null, csrf: null, health: {}, data: Object.fromEntries(COLLS.map((c) => [c, []])), users: [], smtp: null,
  index: null, guides: [], selCert: null, tab: "dash", certFilter: { q: "", status: "", issuer: "" },
  rep: { issuer: "", owner: "", status: "", renewal: "", quick: "" }, importPreview: null, llm: false, sample: null, db: null, canWrite: true };

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }
const role = () => S.user?.role || "";
const actor = () => `${S.user?.name || "사용자"}(${role()})`;
const can = (action) => C.can(role(), action) && (S.mode === "server" || S.canWrite);
const nameOf = (label) => String(label || "").split("(")[0];

// ───────── 서버 API (세션 쿠키 + CSRF 토큰)
async function api(method, url, body) {
  const headers = { Accept: "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (method !== "GET" && S.csrf) headers["X-CSRF-Token"] = S.csrf;
  const r = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && S.user && !url.endsWith("login")) { S.user = null; showAuth("login", "세션이 만료되었습니다. 다시 로그인하세요."); }
  if (!r.ok) { const e = new Error(j.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return j;
}

// ───────── 쓰기: 작업(action) 단위. PC 서버는 서버가 권한·필드·상태를 검사, 웹 시연은 같은 권한표로 화면에서 검사
async function act(action, ops, summary) {
  if (S.mode === "server") return api("POST", "api/action", { action, ops, summary });
  if (!C.can(role(), action)) throw new Error(`권한이 없습니다 (${role()})`);
  if (!S.canWrite) throw new Error("읽기 전용 보기입니다");
  if (role() === "담당자" && C.OWNER_SCOPED.includes(action)) {
    const certs = S.raw.certificates;
    for (const o of ops) {
      const cid = o.op === "closeAlerts" ? o.cert_id : o.coll === "certificates" ? o.id : o.coll === "renewals" ? o.data.old_cert_id
        : o.coll === "deployments" ? (o.data.cert_id || S.raw.deployments.find((d) => d.id === o.id)?.cert_id)
        : o.coll === "notifications" ? S.raw.notifications.find((n) => n.id === o.id)?.cert_id : null;
      if (cid && !C.isOwner(S.user, certs.find((c) => c.id === cid))) throw new Error("본인 담당 인증서만 처리할 수 있습니다");
    }
  }
  for (const o of ops) {
    if (o.op === "set") { const d = { ...o.data }; delete d.id; await S.db.collection(o.coll).doc(o.id).set(JSON.parse(JSON.stringify(d))); }
    else if (o.op === "update") await S.db.collection(o.coll).doc(o.id).update(JSON.parse(JSON.stringify(o.data)));
    else if (o.op === "closeAlerts") for (const n of S.raw.notifications.filter((n) => n.cert_id === o.cert_id && !n.closed))
      await S.db.collection("notifications").doc(n.id).update({ closed: true, closed_at: nowIso() });
  }
  const lab = action === "discovery.decide" ? (ops.every((o) => o.coll === "discoveries" && o.data?.status === "반려") ? "수집 반려" : "수집 승인") : ACTION_LABEL[action] || action;
  await S.db.collection("audit").doc("a_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6)).set({ at: nowIso(), actor: actor(), action: lab, detail: summary || `${ops.length}건` });
  return { ok: true };
}
const ACTION_LABEL = { "discovery.decide": "수집 승인·반려", "discovery.review": "수집 검토", "cert.manage": "관리정보 변경", "cert.renewal": "갱신 처리",
  "import.excel": "관리대장 등록", "deploy.request": "배포 요청", "deploy.review": "배포 검토", "deploy.approve": "배포 승인", "deploy.rollback": "배포 원복", "noti.read": "알림 확인", "guide.manage": "가이드 관리" };

function scope(raw) {

  const mine = new Set(raw.certificates.filter((c) => C.isOwner(S.user, c)).map((c) => c.id));
  return { certificates: raw.certificates.filter((c) => mine.has(c.id)), notifications: raw.notifications.filter((n) => mine.has(n.cert_id)),
    deployments: raw.deployments.filter((d) => mine.has(d.cert_id)), environments: raw.environments.filter((e) => mine.has(e.cert_id) || mine.has(e.prev_cert_id)),
    renewals: raw.renewals.filter((r) => mine.has(r.old_cert_id) || mine.has(r.new_cert_id)), audit: raw.audit.filter((a) => nameOf(a.actor) === S.user.name),
    discoveries: [], scan_runs: [], import_runs: [], guides: raw.guides || [] };
}

function memDb(seed) {
  const st = JSON.parse(JSON.stringify(seed || {}));
  const clone = (x) => JSON.parse(JSON.stringify(x));
  return { collection: (n) => ({
    get: async () => ({ docs: Object.entries(st[n] || {}).map(([id, d]) => ({ id, data: () => clone(d) })) }),
    doc: (id) => ({ set: async (d) => { (st[n] ||= {})[id] = clone(d); }, update: async (d) => { (st[n] ||= {})[id] = { ...((st[n] || {})[id] || {}), ...clone(d) }; } }) }) };
}
async function useSource(src, reload) {
  if (src === "shared" && S.sharedDb) { S.db = S.sharedDb; S.canWrite = S.sharedWrite; S.source = "shared"; }
  else {
    if (!S.seed) { try { S.seed = await (await fetch("seed.json")).json(); } catch { S.seed = {}; } }
    S.db = memDb(S.seed); S.canWrite = true; S.source = "snapshot";
  }
  try { localStorage.setItem("demoSource", S.source); } catch {}
  lockVault();
  $("conn").classList.add("ok");
  $("conn-text").textContent = S.source === "shared" ? `웹 시연 · 공유 DB · ${S.sample ? "생성형 AI 연결" : "검색형 답변"}${S.canWrite ? "" : " · 읽기 전용"}`
    : `웹 시연 · 시연 데이터(이 브라우저에서만 바뀜) · ${S.sample ? "생성형 AI 연결" : "검색형 답변"}`;

// ───────── 대시보드
const urgency = (s) => ({ "D-7": 0, "D-30": 1, "만료": 2 }[s.status] ?? 3);
function renderDash() {
  const certs = active(), cnt = { 정상: 0, "D-30": 0, "D-7": 0, 만료: 0, "사용 전": 0 };
  certs.forEach((c) => cnt[statusOf(c).status]++);
  const pend = S.data.discoveries.filter((d) => d.status === "대기").length;
  const unread = S.data.notifications.filter((n) => !n.read && !n.closed).length;
  const now = Date.now();
  const weekExpiring = certs.filter((c) => { const s = statusOf(c); return s.status === "D-7"; }).length;
  const urgent = certs.map((c) => ({ c, s: statusOf(c) })).filter((x) => ["D-7", "D-30", "만료"].includes(x.s.status) && x.c.renewal_status !== "완료")
    .sort((a, b) => urgency(a.s) - urgency(b.s) || (a.s.status === "만료" ? b.s.days - a.s.days : a.s.days - b.s.days)).slice(0, 8);
  const lastRun = [...S.data.scan_runs].sort((a, b) => String(b.started_at).localeCompare(a.started_at))[0];
  const todo = [];

// 웹 수집 Agent 에서 PFX 열기: 비밀번호 없이 → 보관함(범위가 맞는 것)에서 하나씩 복호화해 시도
async function webOpen(rel, bytes, res) {
  if (!/\.(pfx|p12)$/i.test(rel)) return CertScanner.parseFile(rel, bytes, []);
  try { return await CertScanner.parseFile(rel, bytes, []); } catch (e) { if (!/비밀번호 필요/.test(e.message)) throw e; }
  const cands = C.vaultCandidates(S.vault.all || [], rel);
  if (!cands.length) throw new Error("비밀번호 필요 — 'PFX 비밀번호' 탭에서 등록하세요");
  if (!S.vault.key) throw new Error(`보관함 잠김 — 보관함을 연 뒤 다시 실행하세요 (등록 ${cands.length}개)`);
  for (const sec of cands) {
    let pw;
    try { pw = await VC.dec(S.vault.key, sec.id, sec.enc); } catch { res.vault_errors++; continue; }
    try {
      const recs = await CertScanner.parseFile(rel, bytes, [pw]); pw = null;
      const at = nowIso();
      await S.db.collection("secrets").doc(sec.id).update({ last_used_at: at, last_used_file: rel, use_count: (sec.use_count || 0) + 1, last_result: "성공" });
      sec.last_used_at = at; sec.use_count = (sec.use_count || 0) + 1; res.vault_used++;
      return recs;
    } catch (e) { pw = null; if (!/비밀번호 필요/.test(e.message)) throw e; }
  }
  throw new Error(`비밀번호 불일치 (보관함 ${cands.length}개 시도)`);
}
// ───────── 웹 수집 Agent: 브라우저에서 스캔·파싱 → 승인 대기 등록 (PC 서버의 agents.collect 와 같은 규칙)
function wcSet(list, root) {
  const all = list.filter((f) => f.rel);
  const files = all.filter((f) => CertScanner.isTarget(f.rel)).sort((a, b) => (a.rel < b.rel ? -1 : a.rel > b.rel ? 1 : 0));
  S.wc = { files, excluded: all.length - files.length, root, busy: false, progress: null }; renderDash();
}
function wcFromInput(fl) {
  const arr = Array.from(fl), root = arr[0]?.webkitRelativePath ? arr[0].webkitRelativePath.split("/")[0] : "선택한 파일";
  wcSet(arr.map((f) => ({ rel: f.webkitRelativePath ? f.webkitRelativePath.split("/").slice(1).join("/") : f.name, read: async () => new Uint8Array(await f.arrayBuffer()) })), root);
}
async function wcSamples() {
  try { if (!S.samples) S.samples = await (await fetch("samples.json")).json(); }
  catch { return toast("검증용 파일을 불러오지 못했습니다"); }
  const dec = (b) => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  wcSet(S.samples.map((x) => ({ rel: x.rel, read: async () => dec(x.b64) })), "pem (검증용 13개 파일)");
}
const isoUtc = (t) => t.replace(" ", "T") + "+00:00";
async function webCollect() {
  if (!can("collect.run")) return toast("수집 Agent는 관리자만 실행할 수 있습니다");
  const W = S.wc; if (!W || !W.files.length || W.busy) return;
  W.busy = true; const started = nowIso();
  const certs = S.raw.certificates, byFp = new Map(certs.filter((c) => c.fingerprint).map((c) => [c.fingerprint, c]));
  const discs = new Map(S.raw.discoveries.filter((d) => d.status === "대기").map((d) => [d.fingerprint, d]));
  const rejected = new Set(S.raw.discoveries.filter((d) => d.status === "반려").map((d) => d.fingerprint));
  const res = { files: 0, new_pending: 0, known: 0, failed: 0, renewal_candidates: 0, errors: [], vault_used: 0, vault_errors: 0 };
  W.progress = { pct: 0, label: "수집 중…", ev: [] }; S.agentMsg = ""; renderDash();
  for (const f of W.files) {
    res.files++;
    try {
      const recs = await webOpen(f.rel, await f.read(), res);
      for (const r of recs) {
        const fp = r.sha256_fingerprint;
        if (byFp.has(fp)) {                                   // 이미 관리 중 → 저장 위치만 추가
          const c = byFp.get(fp); if (!(c.locations || []).includes(f.rel)) { c.locations = [...(c.locations || []), f.rel]; await S.db.collection("certificates").doc(c.id).update({ locations: c.locations }); }
          res.known++; W.progress.ev.push({ file: f.rel, ok: true, kind: "기존", text: `이미 관리 중 · ${r.subject_cn}` }); continue;
        }
        if (discs.has(fp)) {                                  // 승인 대기 중 → 위치만 추가
          const d = discs.get(fp); if (!d.locations.includes(f.rel)) { d.locations = [...d.locations, f.rel]; await S.db.collection("discoveries").doc(d.id).update({ locations: d.locations }); }
          res.known++; W.progress.ev.push({ file: f.rel, ok: true, kind: "기존", text: `승인 대기 중 · 위치 추가 · ${r.subject_cn}` }); continue;
        }
        if (rejected.has(fp)) { res.skipped_rejected = (res.skipped_rejected || 0) + 1; W.progress.ev.push({ file: f.rel, ok: true, kind: "기존", text: `이전에 반려한 인증서 · 제외 · ${r.subject_cn}` }); continue; }
        const rec = { ...r, not_before: isoUtc(r.not_before), not_after: isoUtc(r.not_after) };
        const prev = certs.filter((x) => x.fingerprint && !x.replaced_by && x.subject_cn === rec.subject_cn && Date.parse(x.not_after) < Date.parse(rec.not_after)).sort((a, b) => Date.parse(b.not_after) - Date.parse(a.not_after));
        const newer = certs.some((x) => x.fingerprint && !x.replaced_by && String(x.subject_cn).toLowerCase() === String(rec.subject_cn).toLowerCase() && Date.parse(x.not_after) >= Date.parse(rec.not_after));
        const kind = prev.length ? "갱신본" : newer ? "이전 버전" : "신규"; if (prev.length) res.renewal_candidates++;
        const id = "d_" + fp.replace(/:/g, "").slice(0, 16).toLowerCase();
        const doc = { fingerprint: fp, subject_cn: rec.subject_cn, subject_dn: rec.subject_dn, issuer_cn: rec.issuer_cn, issuer_dn: rec.issuer_dn, not_before: rec.not_before, not_after: rec.not_after,
          serial_number: rec.serial_number, version: rec.version, public_key: rec.public_key, signature_algorithm: rec.signature_algorithm, cert_type: rec.cert_type, san: rec.san,
          locations: [f.rel], kind, match_cert_id: prev[0] ? prev[0].id : null, status: "대기", scanned_at: started, folder: W.root };
        await S.db.collection("discoveries").doc(id).set(doc); discs.set(fp, { ...doc, id });
        res.new_pending++; W.progress.ev.push({ file: f.rel, ok: true, kind: "승인 대기", text: `${kind} · ${rec.subject_cn} · 만료 ${C.kstDate(rec.not_after)}` });
      }
    } catch (e) { res.failed++; res.errors.push({ file: f.rel, reason: e.message }); W.progress.ev.push({ file: f.rel, ok: false, text: e.message }); }
    W.progress.pct = Math.round(res.files / W.files.length * 100); W.progress.label = `처리 ${res.files}/${W.files.length}개 · 승인 대기 ${res.new_pending}건 · 기존 ${res.known}건 · 실패 ${res.failed}건`;
    renderDash(); await new Promise((r) => setTimeout(r, 120));
  }
  const runId = "run_" + started.replace(/\D/g, "").slice(0, 14);
  await S.db.collection("scan_runs").doc(runId).set({ started_at: started, folder: W.root, ...res, by: actor(), engine: "웹 수집 Agent" });
  await S.db.collection("audit").doc("a_" + runId).set({ at: started, actor: actor(), action: "수집 실행", detail: `파일 ${res.files}개, 승인 대기 ${res.new_pending}건, 실패 ${res.failed}건 (웹)` });
  W.busy = false; W.progress.label = "완료 · " + W.progress.label;
  S.agentMsg = `파일 ${res.files}개 스캔 → 승인 대기 ${res.new_pending}건(갱신본 ${res.renewal_candidates}), 이미 관리 중 ${res.known}건, 실패 ${res.failed}건` + (res.skipped_rejected ? ` · 이전에 반려한 인증서 ${res.skipped_rejected}건 제외` : "") + (res.vault_used ? ` · 보관함 비밀번호로 연 PFX ${res.vault_used}개` : "") +
    (res.new_pending ? ` · <button class="btn sm" data-go-disc>수집 승인으로 이동</button>` : "");
  toast(`수집 완료: 승인 대기 ${res.new_pending}건`);
  await load();
}

async function onExcel(e) {

    const rows = await X.read(await f.arrayBuffer());
    const v = C.validateImport(rows);
    S.importPreview = { file: f.name, ...v };

  } catch (err) { S.importPreview = null; renderLedger(); toast(`엑셀을 읽지 못했습니다: ${err.message}`); }
}
async function commitImport() {

    await act("import.excel", ops, `${pv.file}: 신규 ${created}건, 관리정보 갱신 ${updated}건, 오류 제외 ${pv.errors.length}건`);
    toast(`관리대장 등록: 신규 ${created}건, 관리정보 갱신 ${updated}건`);

function bindDetail(c) {
  const save = $("d-save");
  if (save) save.onclick = async () => {
    try { await act("cert.manage", [{ op: "update", coll: "certificates", id: c.id, data: { owner: $("d-owner").value.trim(), owner_email: $("d-mail").value.trim(), system: $("d-sys").value.trim() } }], `${c.subject_cn} → 담당 ${$("d-owner").value.trim()}`);
      toast("저장했습니다"); await load(); } catch (e) { toast(`저장 실패: ${e.message}`); }
  };
  const rs = $("d-rs");
  if (rs) rs.onchange = async () => {
    try { const ops = [{ op: "update", coll: "certificates", id: c.id, data: { renewal_status: rs.value } }];
      if (rs.value === "완료") ops.push({ op: "closeAlerts", cert_id: c.id });
      await act("cert.renewal", ops, `${c.subject_cn}: ${c.renewal_status} → ${rs.value}`); toast("갱신 상태를 바꿨습니다"); await load(); } catch (e) { toast(`변경 실패: ${e.message}`); }
  };
  const btn = $("d-renew");
  if (btn) btn.onclick = async () => {
    const d = $("d-newexp").value, note = $("d-note").value.trim();
    if (!d) return toast("신규 만료일을 입력하세요");
    if (c.not_after && Date.parse(d) <= Date.parse(C.kstDate(c.not_after))) return toast("신규 만료일은 기존 만료일보다 늦어야 합니다");
    try {
      await act("cert.renewal", [
        { op: "set", coll: "renewals", id: "r_" + c.id + "_" + Date.now(), data: { old_cert_id: c.id, new_cert_id: null, subject_cn: c.subject_cn,
          old_not_after: c.not_after, new_not_after: d + "T00:00:00+09:00", renewed_at: nowIso(), handled_by: actor(), note: note || "수동 등록" } },
        { op: "update", coll: "certificates", id: c.id, data: { renewal_status: "완료", renewed_at: nowIso() } },
        { op: "closeAlerts", cert_id: c.id }], `${c.subject_cn} 신규 만료일 ${d}`);
      toast("갱신 결과를 등록하고 알림을 종료했습니다"); await load();
    } catch (e) { toast(`등록 실패: ${e.message}`); }
  };
  const dep = $("d-deploy");
  if (dep) dep.onclick = async () => {
    const next = C.STAGES.find((st) => C.deployState(c, S.data.deployments).find((x) => x.code === st.code).dep?.status !== "배포 완료");
    try { await act("deploy.request", C.requestDeployOps(c, next.code, actor(), nowIso(), $("d-depnote").value.trim()), `${c.subject_cn} → ${next.name}`);
      toast(`${next.name} 배포를 요청했습니다. 검토자가 검증합니다.`); await load(); } catch (e) { toast(`요청 실패: ${e.message}`); }
  };
}
function bindCertLinks(root) {
  root.querySelectorAll("[data-cert]").forEach((tr) => {
    const go = () => { S.selCert = tr.dataset.cert; select("certs"); renderCerts();
      if (window.innerWidth < 900) $("cert-detail")?.scrollIntoView({ behavior: "smooth", block: "start" }); };
    tr.onclick = go; tr.onkeydown = (e) => { if (e.key === "Enter") go(); };
  });
}

// ───────── 배포 (4단계 승인·원복)
function renderDeploy() {

          const mine = nameOf(d.requested_by) === me, ok = can("deploy.review") && !mine;
          return `<div class="card" style="padding:12px;margin-bottom:10px"><div class="row"><b class="grow">${esc(d.subject_cn)} → ${esc(d.stage_name)}</b>${pill(d.status, "d")}</div>

            <div class="row" style="margin-top:8px"><input class="f grow" data-rvnote="${esc(d.id)}" placeholder="검토 의견" ${ok ? "" : "disabled"}>
              <button class="btn primary sm" data-rvpass="${esc(d.id)}" ${ok && allOk ? "" : "disabled"}>검토 통과</button><button class="btn danger sm" data-rvfail="${esc(d.id)}" ${ok ? "" : "disabled"}>반려</button></div>
            ${mine ? `<p class="note">본인이 요청한 건은 검토할 수 없습니다.</p>` : !allOk ? `<p class="note">검증 항목이 통과하지 않아 반려만 할 수 있습니다.</p>` : ""}</div>`; }).join("") || `<p class="empty">검토할 배포 요청이 없습니다.</p>`}
      </div>
      <div class="card"><h2>승인 대기 ${approveQ.length}건</h2>

              <button class="btn primary sm" data-approve-dep="${esc(d.id)}" ${ok ? "" : "disabled"}>승인 후 ${esc(d.stage_name)} 반영</button></div>

        const dep = S.data.deployments.find((d) => d.id === C.depId(e.cert_id, e.stage));

          <td class="note">${last ? `${esc(last.action)} · ${esc(last.by)} · ${dt(last.at)}` : ""}</td>
          <td>${okRb ? `<div class="row"><input class="f" data-rbreason="${esc(dep.id)}" placeholder="원복 사유" style="width:130px" aria-label="원복 사유"><button class="btn danger sm" data-rollback="${esc(dep.id)}">직전 배포본으로 원복</button></div>` : ""}</td></tr>`; }), "아직 배포된 환경이 없습니다.", 820)}
    </div>
    <div class="card"><h2>배포 이력</h2>
      ${tbl(["단계", "인증서명", "상태", "요청", "검토", "승인·원복"], recent.map((d) => `<tr><td>${esc(d.stage_name)}</td><td>${esc(d.subject_cn)}</td><td>${pill(d.status, "d")}</td><td class="note">${esc(d.requested_by)}<span class="sub">${dt(d.requested_at)}</span></td><td class="note">${esc(d.review?.reviewed_by || "-")}<span class="sub">${esc(d.review?.comment || "")}</span></td><td class="note">${esc(d.rolled_back_by || d.approved_by || "-")}<span class="sub">${esc(d.rollback_reason || "")}</span></td></tr>`), "배포 이력이 없습니다.", 760)}

    try { await act("deploy.rollback", r.ops, `${d.subject_cn} ${d.stage_name} 원복: ${reason}`); toast("직전 배포본으로 원복했습니다"); await load(); } catch (e) { toast(`원복 실패: ${e.message}`); }
  }));

// ───────── 알림함
function renderNoti() {
  const list = [...S.data.notifications].sort((a, b) => (a.closed - b.closed) || (b.rank - a.rank) || String(b.created_at).localeCompare(a.created_at));
  const mailOk = S.mode === "server" && can("mail.send") && S.health.smtp;
  const unsent = list.filter((n) => !n.closed && n.mail_status !== "발송");

}

async function exportReport(kind) {
  const { rep, rows } = reportRows(), dups = C.duplicateReport(S.data.certificates);
  const head = ["인증서명", "발급기관", "만료일", "남은 일수", "만료 상태", "갱신 상태", "갱신 지연", "담당자", "이메일", "업무시스템", "일련번호", "저장 위치"];
  const body = rows.map((r) => [r.c.subject_cn, r.c.issuer_cn, r.c.not_after ? C.kstDate(r.c.not_after) : "", r.days, r.status, r.renewal, r.delayed ? "Y" : "", r.c.owner || "", r.c.owner_email || "", r.c.system || "", r.c.serial_number || "", (r.c.locations || []).join(" | ")]);
  const stamp = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  if (kind === "csv") {
    const csv = "﻿" + [head, ...body].map((r) => r.map((v) => { const s = String(v ?? ""); return /[",\n]/.test(s) || /^[=+\-@]/.test(s) ? `"${s.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n");
    return saveFile(`인증서_갱신현황_${stamp}.csv`, csv);
  }
  const summary = [["항목", "값"], ["기준일(KST)", stamp], ["작성자", actor()], ["대상", rows.length], ...C.RENEWAL_STATES.map((k) => [`갱신 ${k}`, rep.byRenewal[k] || 0]),
    ...Object.entries(rep.byStatus).map(([k, v]) => [`만료 상태 ${k}`, v]), ["갱신 지연", rep.delayed], ["중복 저장", dups.length]];
  await saveFile(`인증서_갱신현황_${stamp}.xlsx`, X.write([
    { name: "요약", rows: summary, widths: [22, 16] },
    { name: "갱신 현황", rows: [head, ...body], widths: [30, 34, 12, 9, 10, 10, 9, 10, 24, 12, 22, 40] },
    { name: "중복 인증서", rows: [["유형", "인증서명", "개수", "저장 위치"], ...dups.map((d) => [d.type, d.subject_cn, d.count, d.locations.join(" | ")])], widths: [20, 30, 8, 60] },
  ]));
}

async function runOrch() {
  const goal = $("orch-goal").value.trim() || "일일 운영 점검";
  $("orch-run").disabled = true; $("orch-out").innerHTML = `<p class="note">오케스트레이터가 계획을 세우고 Agent를 호출하는 중…</p>`;
  $("orch-graph").innerHTML = orchSvg("collector", {});
  let run;
  try { run = await api("POST", "api/ops/orchestrate", { goal }); } catch (e) { toast(`실행 실패: ${e.message}`); $("orch-run").disabled = false; return; }
  // 실행 흐름을 단계별로 재생(그래프에서 어느 Agent가 일하는지 표시)
  const st = {};
  for (let i = 0; i < run.steps.length; i++) {
    const x = run.steps[i];
    $("orch-graph").innerHTML = orchSvg(x.agent, st);
    $("orch-out").innerHTML = `<p class="note" style="margin-top:10px">계획(${esc(run.plan_note)}): ${run.plan.map((t) => esc(S.ops.tools[t]?.label || t)).join(" → ")}</p>${traceHtml({ steps: run.steps.slice(0, i + 1) })}`;
    st[x.agent] = !x.ok ? "확인" : x.needs_human ? "승인필요" : (st[x.agent] || "정상");
    await new Promise((r) => setTimeout(r, 450));
  }
  await loadOps(); toast(`오케스트레이션 완료: ${run.status} — ${run.result.slice(0, 60)}`);
}
async function sendMaint() {
  const m = $("mchat-in").value.trim(); if (!m) return;

  $("mchat-in").value = ""; $("mchat-send").disabled = true;
  try { await api("POST", "api/ops/chat", { message: m }); } catch (e) { toast(e.message); }
  $("mchat-send").disabled = false; await loadOps();
}

    // 한글 CID 글꼴용 CMap 은 cmaps.json 하나로 묶어 두고 필요할 때 꺼내 씀 (.bcmap 파일을 따로 서비스하지 않아도 되게)
    class PackedCMaps {
      async fetch({ kind, filename }) {
        if (kind !== "cMapUrl") throw new Error(`${kind} 데이터 없음`);
        if (!PackedCMaps.map) PackedCMaps.map = await (await fetch(new URL("vendor/pdfjs/cmaps.json", location.href))).json();
        const b = PackedCMaps.map[filename]; if (!b) throw new Error(`CMap 없음: ${filename}`);
        return Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
      }
    }
    task = pdfjsLib.getDocument({ data: buf, cMapUrl: "cmaps/", cMapPacked: true, BinaryDataFactory: PackedCMaps, useWorkerFetch: false,
      isEvalSupported: false, disableFontFace: true, useSystemFonts: false, stopAtErrors: false });
    doc = await task.promise;
  } catch (e) { throw new Error(/password/i.test(e?.name + e?.message) ? "암호가 걸린 PDF는 열 수 없습니다" : "PDF를 열지 못했습니다(손상되었거나 PDF 형식이 아님)"); }
  if (doc.numPages > 200) throw new Error("200쪽 이하 PDF만 올릴 수 있습니다");
  const lines = [];   // { t, h, page }
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i), tc = await page.getTextContent();
    let cur = { t: "", h: 0, y: null };
    const push = () => { const t = cur.t.replace(/\s+/g, " ").trim(); if (t) lines.push({ t, h: cur.h, page: i }); cur = { t: "", h: 0, y: null }; };
    for (const it of tc.items) {
      if (typeof it.str !== "string") continue;
      const y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 0;
      if (cur.y !== null && Math.abs(y - cur.y) > Math.max(2, h * 0.6) && cur.t.trim()) push();
      cur.t += it.str; cur.h = Math.max(cur.h, h); cur.y = y;
      if (it.hasEOL) push();
    }
    push(); lines.push({ t: "", h: 0, page: i, br: true });
    page.cleanup();
  }
  const pages = doc.numPages;
  await task.destroy();
  const body = lines.filter((l) => l.t);
  if (body.reduce((a, l) => a + l.t.length, 0) < 50) throw new Error("글자를 읽을 수 없는 PDF입니다(스캔 이미지일 수 있음). 글자가 있는 PDF나 Word로 올려 주세요");
  // 머리글·바닥글(여러 쪽에 똑같이 반복되는 줄)과 쪽번호 줄 제거
  const freq = new Map(); body.forEach((l) => freq.set(l.t, (freq.get(l.t) || 0) + 1));
  const hs = body.map((l) => l.h).sort((a, b) => a - b), med = hs[Math.floor(hs.length / 2)] || 10;
  const out = [];
  for (const l of lines) {
    if (l.br) { out.push(""); continue; }
    if ((pages >= 3 && freq.get(l.t) >= Math.max(3, pages * 0.6)) || /^[-–—\s]*\d{1,3}\s*(\/\s*\d{1,3})?[-–—\s]*$/.test(l.t) || /^page\s*\d+/i.test(l.t)) continue;
    const heading = l.h >= med * 1.18 && l.t.length <= 60 && !/[.。]$/.test(l.t);
    out.push(heading ? `\n# ${l.t}\n` : l.t);
  }
  const text = out.join("\n").replace(/\n{3,}/g, "\n\n");
  const title = (body.find((l) => l.h >= med * 1.18 && l.t.length <= 80) || body[0]).t;
  return { text, title };
}
// 파일 → 텍스트 (제목은 '# ' 줄로 바꿔 문단 나누기에 쓰임)
async function guideText(file) {
  const name = file.name, ext = name.split(".").pop().toLowerCase(), buf = new Uint8Array(await file.arrayBuffer());
  const dec = (u) => { const t = new TextDecoder("utf-8").decode(u); return (t.match(/\uFFFD/g) || []).length > 5 ? new TextDecoder("euc-kr").decode(u) : t; };
  if (ext === "pdf") return pdfText(buf);
  if (ext === "docx") {
    const z = await X.unzip(buf.buffer), xml = await z.text("word/document.xml");
    if (!xml) throw new Error("Word 문서 본문을 찾지 못했습니다");
    const paras = xml.match(/<w:p[ >][\s\S]*?<\/w:p>/g) || [];
    return paras.map((p) => { const t = (p.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g) || []).map((x) => x.replace(/<[^>]+>/g, "")).join("").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
      const st = (p.match(/<w:pStyle w:val="([^"]+)"/) || [])[1] || ""; return /heading|제목|title/i.test(st) && t.trim() ? `\n# ${t.trim()}\n` : t; }).join("\n\n");
  }
  if (ext === "html" || ext === "htm") {
    const doc = new DOMParser().parseFromString(dec(buf), "text/html");
    doc.querySelectorAll("script,style,nav,header,footer,noscript,svg").forEach((n) => n.remove());
    const out = [];
    doc.body.querySelectorAll("h1,h2,h3,h4,p,li,pre,td,blockquote,dt,dd").forEach((n) => { if (n.closest("li") && n.tagName !== "LI") return;
      const t = n.textContent.replace(/\s+/g, " ").trim(); if (!t) return; out.push(/^H[1-4]$/.test(n.tagName) ? `\n# ${t}\n` : n.tagName === "LI" ? `- ${t}` : t); });
    return { text: out.join("\n\n"), title: (doc.querySelector("h1")?.textContent || doc.title || "").trim() };
  }
  return dec(buf);
}
async function uploadGuides(files) {
  const done = [], fail = [];
  let next = Math.max(0, ...(S.data.guides || []).map((g) => +String(g.code || "U0").slice(1) || 0)) + 1;
  for (const f of files) {
    try {
      if (f.size > (/\.pdf$/i.test(f.name) ? 20 : 3) * 1024 * 1024) throw new Error(/\.pdf$/i.test(f.name) ? "PDF는 20MB 이하만 올릴 수 있습니다" : "3MB 이하 파일만 올릴 수 있습니다");
      if (/\.json$/i.test(f.name)) {   // 가이드 JSON(기본 가이드와 같은 형식)
        const arr = JSON.parse(new TextDecoder().decode(new Uint8Array(await f.arrayBuffer())));
        for (const g of (Array.isArray(arr) ? arr : [arr])) {
          if (!g.title || !Array.isArray(g.sections)) throw new Error("가이드 JSON 형식(title, sections)이 아닙니다");
          const code = "U" + String(next++).padStart(2, "0"), chars = g.sections.reduce((a, x) => a + String(x.body || "").length, 0);
          await saveGuide({ code, title: String(g.title).slice(0, 100), applies: g.applies || C.detectApplies(JSON.stringify(g)), sources: [f.name], sections: g.sections.map((x) => ({ h: String(x.h || g.title), body: String(x.body || "") })), chars });
          done.push(`${code} ${g.title}`);
        }
        continue;
      }
      const r = await guideText(f), text = typeof r === "string" ? r : r.text;
      if (text.replace(/\s/g, "").length < 50) throw new Error("본문이 너무 짧습니다");
      if (text.length > 150000) throw new Error("본문이 15만 자를 넘습니다. 나눠서 올려 주세요");
      const firstHead = (text.match(/^#\s+(.+)$/m) || [])[1];
      const title = ((typeof r === "object" && r.title) || firstHead || f.name.replace(/\.[^.]+$/, "")).slice(0, 100);
      const sections = C.chunkGuide(title, text);
      if (!sections.length) throw new Error("문단을 만들지 못했습니다");
      const code = "U" + String(next++).padStart(2, "0");
      await saveGuide({ code, title, applies: C.detectApplies(title + " " + text.slice(0, 5000)), sources: [f.name], sections, chars: text.length });
      done.push(`${code} ${title}(문단 ${sections.length}개)`);
    } catch (e) { fail.push(`${f.name}: ${e.message}`); }
  }
  S.guideMsg = (done.length ? `RAG에 추가했습니다: ${done.join(", ")}.` : "") + (fail.length ? ` 실패: ${fail.join(" / ")}` : "");
  if (done.length) S.glist = "uploaded";
  await load();
  if (done.length) toast(`가이드 ${done.length}종을 RAG에 추가했습니다`); else if (fail.length) toast("가이드를 추가하지 못했습니다");
}
async function saveGuide(g) {
  const id = "g_" + C.hashId(g.code + g.title + g.chars + Date.now());
  await act("guide.manage", [{ op: "set", coll: "guides", id, data: { ...g, uploaded_by: actor(), uploaded_at: nowIso(), deleted: false } }], `업로드: ${g.code} ${g.title} · 문단 ${g.sections.length}개`);
}

function renderExamples() {
  $("qa-examples").innerHTML = EXAMPLES.map((q) => `<button type="button">${esc(q)}</button>`).join("");
  $("qa-examples").querySelectorAll("button").forEach((b) => (b.onclick = () => { $("qa-input").value = b.textContent; ask(); }));

function bubble(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; $("chat").appendChild(d); $("chat").scrollTop = 1e9; return d; }
async function llm(prompt, onText) {
  if (S.mode === "server") return (await api("POST", "api/llm", { prompt })).text;
  const r = await S.sample(prompt, { cache: false, modelTier: "default", onText: ({ text }) => onText(text) });
  return r.text;
}
// 답변 검증 AI (챗봇과 별도 호출)
async function verifierLLM(prompt) {
  if (S.mode === "server") {
    const t = (await api("POST", "api/llm", { prompt })).text;
    const m = t.match(/\{[\s\S]*\}/); if (!m) throw new Error("검증 결과 형식 오류"); return JSON.parse(m[0]);
  }
  if (S.sample.json) return S.sample.json(prompt, { cache: false, modelTier: "default" });
  const r = await S.sample(prompt, { cache: false, modelTier: "default" }); const m = r.text.match(/\{[\s\S]*\}/); return JSON.parse(m[0]);
}
function verifyCard(v, rules, note) {
  const d = document.createElement("div"); d.className = "verify v-" + v.verdict;
  const bar = (label, x) => x === null || x === undefined ? "" : `<span class="score">${label} <b>${x}</b><i><b style="width:${x}%"></b></i></span>`;
  const vp = { 적합: "ok", 주의: "warn", 부적합: "bad", 참고: "muted" }[v.verdict] || "muted";
  d.innerHTML = `<div class="vh">답변 검증 AI <span class="pill ${vp}">${esc(v.verdict)}</span>${bar("정확도", v.accuracy)}${bar("품질", v.quality)}${v.ruleOnly ? `<span class="note" style="font-weight:400">규칙 검사</span>` : ""}</div>
    ${v.comment ? `<div style="margin-top:6px">${esc(v.comment)}</div>` : ""}
    ${v.unsupported.length ? `<div style="margin-top:6px"><b>근거로 확인되지 않은 내용</b><ul>${v.unsupported.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${v.missing.length ? `<div style="margin-top:6px"><b>빠진 내용</b><ul>${v.missing.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${rules ? `<div class="rules">규칙 검사: 인용 ${rules.cited.length}개 · 잘못된 인용 ${rules.invalid.length}${rules.invalid.length ? `(${esc(rules.invalid.join(", "))})` : ""} · 근거에 없는 수치 ${rules.numbersNotInContext.length}${rules.numbersNotInContext.length ? `(${esc(rules.numbersNotInContext.join(", "))})` : ""} · 근거에 없는 명령 옵션 ${rules.commandsNotInContext.length}${note ? ` · ${esc(note)}` : ""}</div>` : ""}`;
  return d;
}
async function ask() {
  const q = $("qa-input").value.trim();
  if (!q) return;
  $("qa-input").value = ""; bubble("me", q);
  const out = bubble("bot", "답변 준비 중…");
  const blocked = C.qaGuard(q);
  if (blocked) { out.textContent = blocked; const m = document.createElement("span"); m.className = "meta"; m.textContent = "입력 가드레일에서 차단 · 생성형 AI 호출 안 함"; out.appendChild(m); return; }
  const mentioned = C.findCerts(q, active());     // 담당자는 본인 담당 인증서만 근거로 사용
  let found = null, rmode = "BM25(브라우저)";
  try {                                             // 서버 RAG 검색: 벡터 DB(Qdrant) + BM25 하이브리드
    const r = await api("POST", "/api/qa/retrieve", { q, issuer: mentioned[0]?.issuer_cn || null, k: 4 });
    const byId = new Map(S.index.chunks.map(c => [c.id, c]));
    const hs = (r.hits || []).map(h => ({ chunk: byId.get(h.id), score: h.rrf, vec: h.vec_rank, bm: h.bm25_rank, cos: h.cosine })).filter(h => h.chunk);
    if (hs.length) { found = hs; rmode = r.mode === "hybrid" ? "하이브리드(벡터 DB + BM25)" : "BM25(서버)"; }
  } catch {}
  const hits = C.withRenewalContext(S.index, q, found || C.search(S.index, q, { k: 4, issuer: mentioned[0]?.issuer_cn }), mentioned[0], 4);
  let text, engine = "검색형";
  if (S.llm) {
    try { text = await llm(C.buildPrompt(q, hits, mentioned, Date.now()), (t) => (out.textContent = t)); engine = "생성형 AI"; }
    catch (e) { text = null; out.dataset.err = e.code || e.message; }
  }
  if (!text) text = C.extractiveAnswer(q, hits, mentioned, Date.now());
  out.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
  const meta = document.createElement("span"); meta.className = "meta";
  const srcs = [...new Map(hits.map((h) => [h.chunk.doc, h.chunk])).values()];
  meta.innerHTML = `${engine} 답변${out.dataset.err ? ` (생성형 AI 호출 실패: ${esc(out.dataset.err)} → 검색형)` : ""} · ` +
    `참고: ${srcs.map((c) => `[${esc(c.doc)}] ${esc(c.title)}${c.sources[0]?.startsWith("http") ? ` <a href="${esc(c.sources[0])}" target="_blank" rel="noopener">출처</a>` : c.doc.startsWith("U") ? " (업로드)" : ""}`).join(" · ") || "없음"}`;
  out.appendChild(meta);
  // 답변 검증 AI
  const rules = C.verifyRules(text, hits, mentioned, Date.now());
  if (engine !== "생성형 AI") {   // 검색형: AI가 만든 답이 아니라 원문 인용이므로 검증 AI 카드 대신 안내 한 줄
    const n = document.createElement("p"); n.className = "note"; n.style.margin = "-2px 0 8px";
    n.textContent = "검색형 답변(가이드 원문 인용)입니다. 생성형 AI가 연결되면 답변마다 '답변 검증 AI'의 정확도·품질 평가가 이 자리에 붙습니다.";
    $("chat").appendChild(n); $("chat").scrollTop = 1e9; return;
  }
  // 검증 → (부적합이면) 피드백 반영 재작성 → 재검증 : Self-Correction 루프 (최대 2회)
  const log = [`Plan: 질문 분류 → 인증서 인식 → 근거 검색 → 답변 생성 → 검증 → (부적합 시) 피드백 반영 재작성`,
    `인증서 인식: ${mentioned.map((c) => c.subject_cn).join(", ") || "없음"}`,
    `근거 검색(${rmode}): ${hits.map((h) => h.chunk.id + (h.vec ? ` 벡터${h.vec}위` : "") + (h.bm ? ` BM25 ${h.bm}위` : "")).join(", ")}`, `답변 생성: 생성형 AI · 인용 ${rules.cited.length}개`];
  let cur = { text, rules, out }, verdict = null;
  for (let round = 0; round <= 2; round++) {
    const wait = document.createElement("div"); wait.className = "verify v-참고"; wait.textContent = round ? "검증 피드백을 반영한 답변을 다시 검증하고 있습니다…" : "답변 검증 AI가 정확도·품질을 확인하고 있습니다…";
    $("chat").appendChild(wait); $("chat").scrollTop = 1e9;
    let card;
    try { const raw = await verifierLLM(C.buildVerifyPrompt(q, hits, mentioned, cur.text, Date.now())); verdict = C.normalizeVerdict(raw, cur.rules); card = verifyCard(verdict, cur.rules); }
    catch (e) { verdict = null; card = verifyCard(C.ruleVerdict(cur.rules, false), cur.rules, `검증 AI 호출 실패(${e.code || e.message})`); }
    wait.replaceWith(card);
    log.push(`검증 ${round + 1}차: ${verdict ? `정확도 ${verdict.accuracy} · 품질 ${verdict.quality} → ${verdict.verdict}` : "검증 AI 없음(규칙 검사만)"}${cur.rules.invalid.length + cur.rules.numbersNotInContext.length + cur.rules.commandsNotInContext.length ? ` · 규칙 위반 ${cur.rules.invalid.length + cur.rules.numbersNotInContext.length + cur.rules.commandsNotInContext.length}건` : ""}`);
    if (!verdict || verdict.verdict !== "부적합" || round === 2) break;
    // Self-Correction: 피드백을 넣어 다시 쓰기
    log.push(`Self-Correction ${round + 1}회: 근거 없는 내용 ${verdict.unsupported.length}건 · 빠진 내용 ${verdict.missing.length}건 반영해 재작성`);
    cur.out.classList.add("superseded");
    const o2 = bubble("bot", "검증 피드백을 반영해 답변을 다시 쓰고 있습니다…");
    let t2 = null;
    try { t2 = await llm(C.buildRevisePrompt(q, hits, mentioned, cur.text, verdict, cur.rules, Date.now()), (t) => (o2.textContent = t)); } catch (e) { o2.textContent = `재작성 실패: ${e.message}`; break; }
    o2.innerHTML = esc(t2).replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
    const m2 = document.createElement("span"); m2.className = "meta"; m2.textContent = `생성형 AI 답변 · 검증 피드백 반영 재작성 ${round + 1}회`; o2.appendChild(m2);
    cur = { text: t2, rules: C.verifyRules(t2, hits, mentioned, Date.now()), out: o2 };
  }
  const lg = document.createElement("details"); lg.className = "agentlog";
  lg.innerHTML = `<summary>Agent 추론 로그 (${log.length}단계)</summary><ol>${log.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>`;
  $("chat").appendChild(lg); $("chat").scrollTop = 1e9;
  console.info("[QA Agent]\n" + log.join("\n"));
}
$("qa-form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
